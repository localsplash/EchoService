# EchoService — carrier webhook ingress, and nothing else.
#
# TEMPLATE. `X.TLD` is the whitelabel parent domain this deployment serves
# under; substitute it throughout before use. Adopted from EchoOrchestrator
# at e07b811; EchoService owns this template.
#
# This hostname exists only so Bandwidth and Tychron can POST to
# /v1/{bandwidth,tychron}/*. EchoService's other endpoints are not public:
# browsers reach them through EchoWeb's /api/* routes over the internal network.
# Uses <app>-<role>.X.TLD so the host fits the parent domain's wildcard
# certificate. Configure a matching proxy host even when DNS is wildcarded.
#
# Historical/fallback reference only. Nginx Proxy Manager owns the live edge.

server {
    listen 80;
    listen [::]:80;
    server_name echo-webhook.X.TLD;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name echo-webhook.X.TLD;

    # Select a certificate for echo-webhook.X.TLD or *.X.TLD.
    # Left as an unresolvable placeholder on purpose: a SAN mismatch
    # reaches the carrier as a failed handshake, which it reports as a delivery
    # failure — far harder to trace back to here than nginx refusing to start.
    ssl_certificate     /opt/nginx-proxy-manager/letsencrypt/live/npm-REPLACE/fullchain.pem;
    ssl_certificate_key /opt/nginx-proxy-manager/letsencrypt/live/npm-REPLACE/privkey.pem;

    # Inbound Tychron MMS carries its media inline as base64 in the webhook
    # body, where Bandwidth sends a URL to fetch later. base64 adds about a
    # third, and Tychron's per-file ceiling is 2 MB, so nginx's 1 MB default
    # would 413 an ordinary photo — and because Tychron treats any non-2xx as
    # a temporary failure, it would redeliver that message indefinitely.
    #
    # Matches EchoService's own express.json limit, so the application is what
    # enforces the ceiling with a real error rather than the proxy with a bare
    # 413.
    client_max_body_size 10m;

    location /v1/ {
        proxy_pass http://echo-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ping {
        proxy_pass http://echo-service:8080;
    }

    location / {
        return 404;
    }
}
