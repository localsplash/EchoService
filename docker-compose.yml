# Standalone dev — for full stack use EchoOrchestrator instead.
# Runtime settings come from PlatformConfig; the database pool remains bootstrap.
services:
  echo-service:
    build: .
    container_name: echo-service
    environment:
      PORT: "8080"
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-13306}
      DB_USER: ${DB_USER:-echo_app}
      DB_PASSWORD: ${DB_PASSWORD:-devpass}
      DB_NAME: ${DB_NAME:-echo_db}
      NOCODB_BASE_URL: ${NOCODB_BASE_URL:?Set the PlatformConfig NocoDB URL}
      NOCODB_API_TOKEN: ${NOCODB_API_TOKEN:?Set this service NocoDB token}
      # Pin the trusted network instead of reading it from NocoDB.
      IDENTITY_TRUSTED_NETWORK: ${IDENTITY_TRUSTED_NETWORK:-}
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - echo_media_data:/media
      # Preserve operational logs independently from optional bootstrap data.
      - echo_service_logs:/var/log/echo
    restart: unless-stopped

volumes:
  echo_media_data:
  echo_service_logs:
