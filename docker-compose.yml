# Standalone dev — for full stack use EchoOrchestrator instead.
#
# EchoService reads its settings from echo_tbl_Settings in the Echo database.
# What is stated here is only what cannot describe itself: how to reach that
# database, and how to reach the IdentityBase base carrying trustedCIDR.
services:
  echo-service:
    build: .
    container_name: echo-service
    environment:
      PORT: "8080"
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-13306}
      DB_USER: ${DB_USER:-echo_app}
      DB_PASSWORD: ${DB_PASSWORD:-devpass}
      DB_NAME: ${DB_NAME:-echo_db}
      NOCODB_BASE_URL: ${NOCODB_BASE_URL:-http://host.docker.internal:18090}
      NOCODB_API_TOKEN: ${NOCODB_API_TOKEN:-}
      # Pin the trusted network instead of reading it from NocoDB.
      IDENTITY_TRUSTED_NETWORK: ${IDENTITY_TRUSTED_NETWORK:-}
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - echo_media_data:/media
    restart: unless-stopped

volumes:
  echo_media_data:
